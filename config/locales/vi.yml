    form_description: "Chọn cặp ngôn ngữ và thuật ngữ ưu tiên. Thao tác này không chạy model AI."
  help:
    nav: "Trung tâm trợ giúp"
    title: "Trung tâm trợ giúp"
    description: "Tìm hiểu cách dùng model, phiên dịch riêng tư, thuật ngữ và kiểm soát chi phí trước khi gửi yêu cầu."
    studio_title: "Làm thế nào để dịch văn bản?"
    studio_text: "Nhập nhãn ngôn ngữ nguồn và đích, dán văn bản, chọn 1–4 model khả dụng rồi xác nhận khả năng phát sinh phí inference. Các model chạy độc lập."
    limits_title: "Vì sao Gateway v1 giới hạn 1.000 ký tự?"
    limits_text: "Translation Gateway v1 chấp nhận tối đa 1.000 ký tự Unicode mỗi yêu cầu. Adapter khác có giới hạn riêng theo nhà cung cấp. Rails có ngưỡng an toàn 20.000 ký tự Unicode. Hệ thống chưa tự chia văn bản dài."
    glossary_title: "Glossary hoạt động như thế nào?"
    glossary_text: "Thêm cặp thuật ngữ gốc→đích đang bật, sau đó chọn Dùng Glossary trong Tùy chọn nâng cao ở Studio. Các thuật ngữ khớp cặp ngôn ngữ chỉ được đưa vào lời hướng dẫn tham khảo đối với endpoint OpenAI-compatible chat. Không bảo đảm model luôn dùng đúng từ, và Gateway v1 chưa hỗ trợ."
    glossary_snapshot_title: "Nếu sửa thuật ngữ khi đang dịch thì sao?"
    glossary_snapshot_text: "Cặp thuật ngữ phù hợp được mã hóa và đóng băng cùng phiên dịch trước khi xếp job tính phí. Sửa hoặc xóa thuật ngữ không ảnh hưởng job đang chờ. Mỗi phiên sử dụng tối đa 20 thuật ngữ phù hợp."
    glossary_matching_title: "Vì sao thuật ngữ không được áp dụng?"
    glossary_matching_text: "Nhãn ngôn ngữ phải khớp với cặp thuật ngữ (không phân biệt hoa/thường) và thuật ngữ gốc phải xuất hiện trong văn bản. Chỉ thuật ngữ đang bật mới hợp lệ. Nếu không có thuật ngữ khớp, yêu cầu bật Glossary sẽ bị từ chối trước khi gọi inference."
    model_title: "Có thể dùng nhiều nhà cung cấp không?"
    model_text: "Có. Bạn cấu hình URL, adapter và token mã hóa của từng model trong Cài đặt hệ thống. Khi bật Glossary, chỉ được chọn model OpenAI-compatible; hãy tắt Glossary nếu muốn so sánh với Gateway v1."
    history_title: "Xem lịch sử có tốn GPU không?"
    history_text: "Không. Xem, lọc, so sánh và tải phiên dịch đã lưu chỉ đọc dữ liệu. Chức năng làm mới trạng thái thủ công chỉ xếp lịch GET polling an toàn, không gửi lại POST dịch."
    export_title: "File tải về chứa dữ liệu gì?"
    export_text: "TXT, Markdown và JSON chứa văn bản nguồn và kết quả đã lưu, không có credential hoặc raw API response. Hãy bảo mật các file được tải về."
    safety_title: "Nếu provider timeout thì sao?"
    safety_text: "Yêu cầu tính phí có kết quả chưa rõ sẽ không tự động thử lại. Hãy kiểm tra trạng thái và dùng GET polling trước khi cân nhắc gửi yêu cầu mới."
