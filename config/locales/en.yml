  help:
    nav: "Help Center"
    title: "Help Center"
    description: "Understand models, private sessions, glossary terms and inference safety before submitting any paid request."
    studio_title: "How do I translate text?"
    studio_text: "Enter the source and target language labels, paste your text, choose 1–4 available models and confirm the possible inference charges. The selected models run independently."
    limits_title: "Why does Gateway v1 have a 1,000-character limit?"
    limits_text: "Translation Gateway v1 accepts at most 1,000 Unicode code points per translation request. Other adapters have provider-specific limits. Rails independently limits requests to 20,000 code points. Text is not automatically split."
    glossary_title: "How does the glossary work?"
    glossary_text: "Add active source→target term pairs, then turn on Use glossary under Advanced options in Studio. Matching terms for the exact language pair are included as reference instructions only for OpenAI-compatible chat endpoints. This cannot guarantee exact wording, and Gateway v1 is not supported."
    glossary_snapshot_title: "What happens if I edit a term during translation?"
    glossary_snapshot_text: "Matching term pairs are encrypted and frozen with the translation request before any paid job is queued. Changing or deleting an entry never changes an in-flight job. A request uses at most 20 matched terms."
    glossary_matching_title: "Why are my terms not applied?"
    glossary_matching_text: "Language labels must match the term's pair ignoring case, and its source term must appear in the input. Only active terms are eligible. If none match, the request with Glossary enabled is rejected before inference."
    model_title: "Can I mix providers?"
    model_text: "Yes. Configure each model's URL, adapter and encrypted token in System Settings. Glossary-enabled requests are restricted to OpenAI-compatible models; disable Glossary when comparing them with Gateway v1."
    history_title: "Can viewing history cause GPU charges?"
    history_text: "No. Viewing, filtering, comparing or downloading saved sessions uses stored data. The optional manual status refresh only schedules safe provider GET polling, not a new translation POST."
    export_title: "What is included in downloads?"
    export_text: "The TXT, Markdown and JSON exports include the saved input and model results, excluding provider credentials and raw API response snapshots. Treat downloaded files as sensitive."
    safety_title: "What if a provider times out?"
    safety_text: "An uncertain billable request is not automatically repeated. Inspect status and use read-only polling rather than resubmitting without checking the provider first."
    links_title: "Quick links"
    studio_link: "Translation Studio"
    glossary_link: "Manage glossary"
    settings_link: "System Settings"
