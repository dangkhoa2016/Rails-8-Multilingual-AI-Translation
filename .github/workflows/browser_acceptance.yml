name: Browser Acceptance (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/browser_acceptance_app
      QUEUE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/browser_acceptance_queue
      CACHE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/browser_acceptance_cache
      BROWSER_BASE_URL: http://127.0.0.1:3108

    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the three browser engines
        run: |
          python3 -m pip install "playwright==1.65.1"
          python3 -m playwright install --with-deps chromium firefox webkit

      - name: Generate disposable application secrets
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 40)"
          echo "::add-mask::$password"
          {
            echo "ADMIN_EMAIL=browser-ci@example.test"
            echo "ADMIN_PASSWORD=$password"
            echo "BROWSER_ADMIN_EMAIL=browser-ci@example.test"
            echo "BROWSER_ADMIN_PASSWORD=$password"
            echo "SECRET_KEY_BASE=$(openssl rand -hex 64)"
            echo "AR_ENCRYPTION_PRIMARY_KEY=$(openssl rand -hex 32)"
            echo "AR_ENCRYPTION_DETERMINISTIC_KEY=$(openssl rand -hex 32)"
            echo "AR_ENCRYPTION_KEY_DERIVATION_SALT=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Initialize clean PostgreSQL databases and catalog
        run: |
          bin/rails db:prepare
          bin/rails db:seed
          bin/rails tailwindcss:build

      - name: Start isolated Rails preview
        shell: bash
        run: |
          set -euo pipefail
          bin/rails server -b 127.0.0.1 -p 3108 -P "$RUNNER_TEMP/browser-rails.pid" > "$RUNNER_TEMP/browser-rails.log" 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent --output /dev/null "$BROWSER_BASE_URL/login"; then
              echo "Local preview ready"
              exit 0
            fi
            sleep 2
          done
          tail -n 50 "$RUNNER_TEMP/browser-rails.log"
          exit 1

      - name: Verify Chromium, Firefox and WebKit without inference
        shell: bash
        run: |
          set -euo pipefail
          for engine in chromium firefox webkit; do
            echo "Browser acceptance: $engine"
            BROWSER_ENGINE="$engine" python3 -u scripts/browser_acceptance.py
          done
